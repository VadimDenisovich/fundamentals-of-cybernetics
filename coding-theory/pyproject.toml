[project]
name = "codingtheory"
version = "1.0.0"
description = "Сравнительный анализ помехоустойчивости кодов Рида-Соломона и BCH"
requires-python = ">=3.10"
dependencies = [
    "galois>=0.4",
    "reedsolo>=1.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
